<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Reproducible experiment and evidence pipeline</title>
  <desc id="desc">Versioned YAML contracts generate a 2600-run matched experiment, followed by run validation, matrix audit, paired bootstrap analysis, and curated results.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#31556f"/></marker>
    <style>text{font-family:'DejaVu Sans',Arial,sans-serif}.t{font-size:25px;font-weight:700;fill:#102a43}.n{font-size:17px;font-weight:700;fill:#173f5f}.s{font-size:13px;font-weight:400;fill:#526b7a}.k{font-size:12px;font-weight:700;fill:#2563eb}.b{fill:#fff;stroke:#8fa9ba;stroke-width:1.5}.l{stroke:#31556f;stroke-width:2;marker-end:url(#a)}</style>
  </defs>
  <rect width="1440" height="360" fill="#fff"/><rect x="24" y="24" width="1392" height="312" rx="18" fill="#fbfdfe" stroke="#d3dee6"/>
  <text x="60" y="70" class="t">Configuration-to-evidence pipeline</text>
  <line x1="250" y1="188" x2="292" y2="188" class="l"/><line x1="486" y1="188" x2="528" y2="188" class="l"/><line x1="722" y1="188" x2="764" y2="188" class="l"/><line x1="958" y1="188" x2="1000" y2="188" class="l"/><line x1="1194" y1="188" x2="1236" y2="188" class="l"/>
  <g transform="translate(56 114)"><rect width="194" height="148" rx="11" class="b"/><text x="97" y="34" text-anchor="middle" class="k">01 · DECLARE</text><text x="97" y="65" text-anchor="middle" class="n">YAML contracts</text><text x="97" y="92" text-anchor="middle" class="s">traffic · radio · QoS</text><text x="97" y="114" text-anchor="middle" class="s">loads · seeds · policies</text></g>
  <g transform="translate(292 114)"><rect width="194" height="148" rx="11" class="b"/><text x="97" y="34" text-anchor="middle" class="k">02 · EXECUTE</text><text x="97" y="65" text-anchor="middle" class="n">2,600 ns-3 runs</text><text x="97" y="92" text-anchor="middle" class="s">2 policies × 26 loads</text><text x="97" y="114" text-anchor="middle" class="s">× 50 matched seeds</text></g>
  <g transform="translate(528 114)"><rect width="194" height="148" rx="11" class="b"/><text x="97" y="34" text-anchor="middle" class="k">03 · VALIDATE</text><text x="97" y="65" text-anchor="middle" class="n">Per-run checks</text><text x="97" y="92" text-anchor="middle" class="s">files · duration · classes</text><text x="97" y="114" text-anchor="middle" class="s">Tx/Rx accounting · bounds</text></g>
  <g transform="translate(764 114)"><rect width="194" height="148" rx="11" fill="#eef6fa" stroke="#557b92" stroke-width="1.5"/><text x="97" y="34" text-anchor="middle" class="k">04 · AUDIT</text><text x="97" y="65" text-anchor="middle" class="n">Matrix integrity</text><text x="97" y="92" text-anchor="middle" class="s">coverage · pairing · QFI/5QI</text><text x="97" y="114" text-anchor="middle" class="s">traffic contract · loss</text></g>
  <g transform="translate(1000 114)"><rect width="194" height="148" rx="11" fill="#eaf2fb" stroke="#2563eb" stroke-width="1.5"/><text x="97" y="34" text-anchor="middle" class="k">05 · ANALYZE</text><text x="97" y="65" text-anchor="middle" class="n">Paired bootstrap</text><text x="97" y="92" text-anchor="middle" class="s">matched-seed deltas</text><text x="97" y="114" text-anchor="middle" class="s">10,000 resamples · 95% CI</text></g>
  <g transform="translate(1236 114)"><rect width="148" height="148" rx="11" fill="#eaf4ed" stroke="#4f8364" stroke-width="1.5"/><text x="74" y="34" text-anchor="middle" class="k">06 · CURATE</text><text x="74" y="65" text-anchor="middle" class="n">Evidence</text><text x="74" y="92" text-anchor="middle" class="s">tables · plots</text><text x="74" y="114" text-anchor="middle" class="s">metadata · audit</text></g>
</svg>
